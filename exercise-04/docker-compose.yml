version: '3.8'

networks:
  my-bridge-net:
    driver: bridge
    name: my-bridge-net

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    networks:
      - my-bridge-net
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - my-bridge-net
    restart: unless-stopped

  flask:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: flask-api:latest
    container_name: flask
    networks:
      - my-bridge-net
    ports:
      - "5001:5001"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
